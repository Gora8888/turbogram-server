<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TurboGram</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/images.png">
  <style>
    :root { --bg-main: #000000; --bg-side: #11161d; --bg-glass: rgba(28, 36, 47, 0.78); --bg-input: rgba(255, 255, 255, 0.08); --bg-msg-in: #1c242f; --bg-msg-out: #2b5278; --accent: #3390ec; --msg-size: 16px; --border: rgba(255, 255, 255, 0.08); }
    body.theme-oled { --bg-main: #000000; --bg-side: #000000; --bg-glass: rgba(28, 28, 30, 0.82); --bg-msg-in: #1c1c1e; --bg-msg-out: #2b5278; }
    body.theme-blue { --bg-main: #0e1621; --bg-side: #17212b; --bg-glass: rgba(23, 33, 43, 0.82); --bg-msg-in: #182533; --bg-msg-out: #2b5278; }
    .messages.wall-bg1 { background: url('/image.jpg') repeat; background-size: 340px; }
    .messages.wall-bg2 { background: url('/image (1).jpg') center/cover no-repeat; }
    .messages.wall-bg3 { background: url('/image (2).jpg') repeat; background-size: 340px; }
    .messages.wall-bg4 { background: url('/image (3).jpg') center/cover no-repeat; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { position: fixed; inset: 0; width: 100%; height: 100%; max-width: 100vw; background: var(--bg-main); color: #fff; display: flex; overflow: hidden; }
    .svg-ico { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; display: block; flex-shrink: 0; }

    /* Модальные окна */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.72); display: flex; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    .modal-overlay[style*="display: none"] { display: none !important; }
    .modal-box { background: #161d26; padding: 22px; border-radius: 24px; width: 380px; text-align: center; max-height: 90dvh; overflow-y: auto; border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65); }
    .auth-input, .select-input { width: 100%; margin-bottom: 10px; padding: 12px 14px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.07); color: #fff; outline: none; font-size: 16px; }
    .btn-primary { width: 100%; padding: 13px; border-radius: 14px; border: none; background: #3390ec; color: #fff; font-weight: 600; cursor: pointer; font-size: 16px; }
    .auth-back { margin-top: 12px; font-size: 15px; color: #3390ec; cursor: pointer; display: none; }
    .auth-error { color: #ff453a; font-size: 13.5px; margin-bottom: 10px; min-height: 18px; }
    .mode-switch-bar { display: flex; gap: 8px; justify-content: center; margin-bottom: 14px; background: rgba(255, 255, 255, 0.06); padding: 4px; border-radius: 14px; }
    .mode-btn { flex: 1; padding: 8px; border-radius: 10px; border: none; background: transparent; color: #8e8e93; cursor: pointer; font-size: 13.5px; font-weight: 600; }
    .mode-btn.active { background: rgba(255, 255, 255, 0.14); color: #fff; }
    .ios-group-card { background: rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 12px; margin-bottom: 12px; text-align: left; border: 1px solid rgba(255, 255, 255, 0.06); }
    .set-label { display: block; text-align: left; font-size: 12px; color: #8e8e93; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.4px; }

    /* Панель папок ПК */
    .folders-bar { width: 74px; background: #0b0f14; border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding-top: 12px; gap: 6px; }
    .folder-item { width: 64px; padding: 9px 4px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; color: #8e8e93; font-size: 11px; }
    .folder-item.active, .folder-item:hover { background: rgba(255, 255, 255, 0.08); color: #3390ec; }
    .bottom-tools { margin-top: auto; margin-bottom: 12px; display: flex; flex-direction: column; gap: 6px; align-items: center; }
    .my-avatar-circle { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, #5ac8fa, #007aff); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; overflow: hidden; }
    .my-avatar-circle img { width: 100%; height: 100%; object-fit: cover; }

    /* Список чатов */
    .sidebar { width: 340px; background: var(--bg-main); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .search-box { padding: 6px 14px 8px; }
    .search-box input { width: 100%; padding: 9px 14px; border-radius: 12px; border: none; background: rgba(118, 118, 128, 0.24); color: #fff; outline: none; font-size: 16px; text-align: center; }
    .search-box input:focus { text-align: left; }
    .chat-list { flex: 1; overflow-y: auto; }
    .chat-item { padding: 9px 14px; cursor: pointer; display: flex; align-items: center; gap: 12px; position: relative; }
    .chat-item::after { content: ''; position: absolute; bottom: 0; left: 82px; right: 0; height: 0.5px; background: rgba(255, 255, 255, 0.08); }
    .chat-item.active { background: rgba(51, 144, 236, 0.22); }
    .avatar { width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, #5ac8fa 0%, #007aff 100%); display: flex; align-items: center; justify-content: center; font-weight: 700; position: relative; flex-shrink: 0; overflow: hidden; font-size: 20px; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .online-dot { width: 14px; height: 14px; background: #34c759; border-radius: 50%; position: absolute; bottom: 1px; right: 1px; border: 2.5px solid var(--bg-main); }
    .chat-info { flex: 1; min-width: 0; }
    .chat-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; }
    .chat-name { font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.2px; }
    .chat-time { font-size: 13px; color: #8e8e93; flex-shrink: 0; }
    .chat-bottom { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    .chat-preview { font-size: 14.5px; color: #8e8e93; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
    .unread-badge { background: #3390ec; color: #fff; font-size: 13px; font-weight: 700; min-width: 22px; height: 22px; border-radius: 11px; padding: 0 7px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

    /* Окно переписки */
    .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-main); position: relative; max-width: 100vw; overflow-x: hidden; }
    .chat-header { padding: 8px 12px; background: var(--bg-side); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; min-height: 56px; z-index: 20; }
    .header-left { display: flex; align-items: center; gap: 10px; min-width: 0; cursor: pointer; }
    .mobile-back-btn { display: none; background: transparent; border: none; color: #3390ec; font-size: 26px; cursor: pointer; padding-right: 4px; line-height: 1; }
    .header-avatar { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, #5ac8fa 0%, #007aff 100%); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; overflow: hidden; flex-shrink: 0; }
    .header-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .chat-header-title { font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.2px; }
    .chat-header-sub { font-size: 12.5px; color: #8e8e93; }
    .chat-header-sub.is-online, .chat-header-sub.is-typing { color: #3390ec; font-weight: 500; }
    .header-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .call-btn { background: transparent; color: #3390ec; border: none; padding: 6px 8px; border-radius: 50%; cursor: pointer; display: none; }
        /* Три раздельные стеклянные капсулы сверху чата */
    .ios-back-pill { display: none; align-items: center; gap: 6px; height: 44px; padding: 0 12px; border-radius: 22px; background: var(--bg-glass); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); border: 1px solid rgba(255, 255, 255, 0.14); color: #fff; cursor: pointer; flex-shrink: 0; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35); }
    .ios-unread-pill { background: #fff; color: #000; font-size: 13.5px; font-weight: 700; padding: 2px 8px; border-radius: 12px; line-height: 1.2; }
    .ios-right-avatar-pill { display: none; width: 44px; height: 44px; border-radius: 50%; padding: 2px; background: var(--bg-glass); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); border: 1px solid rgba(255, 255, 255, 0.14); cursor: pointer; flex-shrink: 0; overflow: hidden; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35); }
    .ios-right-avatar-inner { width: 100%; height: 100%; border-radius: 50%; background: linear-gradient(135deg, #5ac8fa 0%, #007aff 100%); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; overflow: hidden; }
    .ios-right-avatar-inner img { width: 100%; height: 100%; object-fit: cover; }

    .pin-bar { background: var(--bg-glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); padding: 7px 14px; border-bottom: 1px solid var(--border); display: none; justify-content: space-between; align-items: center; font-size: 13px; color: #3390ec; z-index: 15; }
    .call-bar { background: #1c2c40; padding: 10px 14px; display: none; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--border); z-index: 25; }
    .video-grid { display: flex; gap: 10px; justify-content: center; }
    .video-grid video { width: 160px; height: 110px; background: #000; border-radius: 12px; object-fit: cover; display: none; }
    .hangup-btn { background: #ff3b30; border: none; color: #fff; padding: 6px 12px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 13px; }

    /* Пузыри сообщений */
    .messages { flex: 1; padding: 12px 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
    .msg { max-width: 78%; padding: 8px 12px 7px; border-radius: 18px; font-size: var(--msg-size); line-height: 1.38; word-wrap: break-word; position: relative; cursor: pointer; }
    .msg.incoming { background: var(--bg-msg-in); align-self: flex-start; border-bottom-left-radius: 5px; margin-bottom: 4px; }
    .msg.incoming::before { content: ""; position: absolute; bottom: 0; left: -5px; width: 11px; height: 14px; background: var(--bg-msg-in); clip-path: polygon(100% 0, 0 100%, 100% 100%); }
    .msg.outgoing { background: var(--bg-msg-out); align-self: flex-end; border-bottom-right-radius: 5px; margin-bottom: 4px; }
    .msg.outgoing::after { content: ""; position: absolute; bottom: 0; right: -5px; width: 11px; height: 14px; background: var(--bg-msg-out); clip-path: polygon(0 0, 0 100%, 100% 100%); }
    .msg-author { font-size: 13px; color: #5ac8fa; margin-bottom: 2px; font-weight: 600; }
    .reply-quote { border-left: 2.5px solid #5ac8fa; background: rgba(0, 0, 0, 0.25); padding: 4px 8px; border-radius: 8px; font-size: 13px; margin-bottom: 5px; }
    .spoiler { background: #4a5a6a; color: transparent; border-radius: 4px; padding: 0 4px; cursor: pointer; }
    .spoiler.revealed { background: rgba(255, 255, 255, 0.12); color: inherit; }
    .msg-img { max-width: 100%; border-radius: 12px; margin-top: 3px; display: block; }
    .msg-file-box { display: flex; align-items: center; gap: 8px; background: rgba(0, 0, 0, 0.25); padding: 8px 10px; border-radius: 12px; margin-top: 3px; color: #fff; text-decoration: none; font-size: 14px; }
    .msg-meta { float: right; margin: 5px 0 -2px 10px; font-size: 11px; color: rgba(255, 255, 255, 0.55); display: inline-flex; align-items: center; gap: 3px; }
    .msg.outgoing .msg-meta { color: #90caf9; }
    .reactions-row { display: flex; gap: 4px; margin-top: 5px; clear: both; }
    .reaction-badge { background: rgba(51, 144, 236, 0.24); border: 1px solid rgba(51, 144, 236, 0.45); padding: 2px 8px; border-radius: 12px; font-size: 12px; }

    /* Контекстное меню и ввод */
    .context-menu { position: fixed; background: rgba(28, 36, 47, 0.92); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 16px; padding: 6px; display: none; flex-direction: column; min-width: 190px; z-index: 200; box-shadow: 0 12px 36px rgba(0, 0, 0, 0.65); }
    .ctx-item { padding: 10px 14px; font-size: 15px; border-radius: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .ctx-item:hover { background: rgba(255, 255, 255, 0.08); }
    .ctx-item.danger { color: #ff453a; }
    .reply-preview-bar { background: var(--bg-glass); backdrop-filter: blur(18px); padding: 8px 14px; border-top: 1px solid var(--border); display: none; justify-content: space-between; align-items: center; font-size: 13.5px; color: #3390ec; }
    .emoji-picker { position: absolute; bottom: 64px; left: 12px; right: 12px; max-width: 340px; background: rgba(28, 36, 47, 0.92); backdrop-filter: blur(22px); border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 18px; padding: 10px; display: none; grid-template-columns: repeat(8, 1fr); gap: 6px; z-index: 50; }
    .emoji-item { font-size: 22px; cursor: pointer; text-align: center; }
    .input-area { padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); background: rgba(10, 14, 20, 0.85); backdrop-filter: blur(20px); border-top: 1px solid rgba(255, 255, 255, 0.06); display: flex; gap: 8px; align-items: center; width: 100%; }
    .ios-circle-tool { width: 38px; height: 38px; border-radius: 50%; background: rgba(255, 255, 255, 0.09); border: 1px solid rgba(255, 255, 255, 0.12); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
    .input-capsule { flex: 1; display: flex; align-items: center; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 22px; padding: 1px 8px 1px 14px; min-width: 0; }
    .input-capsule input[type="text"] { flex: 1; padding: 8px 4px; border: none; background: transparent; color: #fff; font-size: 16px; outline: none; min-width: 0; }
    .inside-sticker-btn { background: transparent; border: none; color: #8e8e93; cursor: pointer; padding: 5px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .main-action-btn { width: 38px; height: 38px; border-radius: 50%; background: rgba(255, 255, 255, 0.09); border: 1px solid rgba(255, 255, 255, 0.12); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
    .main-action-btn.has-text { background: #3390ec; border-color: #3390ec; }
    .main-action-btn.recording { background: #ff3b30; border-color: #ff3b30; }

    /* Мобильная адаптация iOS */
    .ios-top-header, .ios-folders-pills, .mobile-bottom-nav { display: none; }
    .ios-pill-btn { background: var(--bg-glass); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.14); color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 15px; font-weight: 500; cursor: pointer; }
    .ios-icon-circle { width: 36px; height: 36px; border-radius: 50%; background: var(--bg-glass); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.14); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .ios-icon-circle.blue { background: #3390ec; border-color: #3390ec; }
    .ios-center-title { position: absolute; left: 50%; transform: translateX(-50%); font-size: 17px; font-weight: 700; pointer-events: none; }
    .ios-folders-pills { margin: 2px 14px 8px; background: rgba(118, 118, 128, 0.2); padding: 3px; border-radius: 18px; gap: 4px; overflow-x: auto; }
    .ios-pill-tab { padding: 6px 14px; border-radius: 15px; font-size: 13.5px; font-weight: 600; color: #8e8e93; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; flex-shrink: 0; }
    .ios-pill-tab.active { background: rgba(255, 255, 255, 0.16); color: #fff; }
    .ios-pill-badge { background: rgba(255, 255, 255, 0.2); color: #fff; font-size: 11.5px; padding: 1px 6px; border-radius: 10px; }
    .folder-chat-pick { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: rgba(255, 255, 255, 0.06); border-radius: 12px; margin-bottom: 6px; font-size: 15px; cursor: pointer; }

    /* Полноэкранные Настройки iOS */
    #settingsModal { background: #000000 !important; padding: 0 !important; align-items: stretch !important; z-index: 35 !important; }
    #settingsModal .modal-box { width: 100% !important; max-width: 480px !important; height: 100dvh !important; max-height: 100dvh !important; border-radius: 0 !important; background: #000000 !important; border: none !important; box-shadow: none !important; padding: calc(max(50px, env(safe-area-inset-top)) + 6px) 16px 100px !important; margin: 0 auto; overflow-y: auto; }
    .ios-set-topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .ios-set-ava-wrap { width: 98px; height: 98px; border-radius: 50%; background: linear-gradient(135deg, #5ac8fa, #007aff); margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 700; overflow: hidden; cursor: pointer; }
    .ios-set-ava-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .ios-set-name { font-size: 26px; font-weight: 700; margin-bottom: 4px; }
    .ios-set-sub { font-size: 14.5px; color: #8e8e93; margin-bottom: 18px; }
        .ios-change-photo-btn { width: 100%; padding: 13px 16px; border-radius: 16px; background: #1c242f; border: 1px solid rgba(255,255,255,0.08); color: #4ea4f6; font-size: 16px; font-weight: 500; display: flex; align-items: center; gap: 12px; cursor: pointer; margin-bottom: 18px; }
    .ios-list-group { background: #1c242f; border-radius: 18px; overflow: hidden; margin-bottom: 18px; border: 1px solid rgba(255,255,255,0.06); }
    .ios-list-row { display: flex; align-items: center; padding: 11px 14px; gap: 14px; cursor: pointer; position: relative; text-align: left; }
    .ios-list-row:active { background: rgba(255,255,255,0.06); }
    .ios-list-row:not(:last-child)::after { content: ''; position: absolute; bottom: 0; left: 58px; right: 0; height: 0.5px; background: rgba(255,255,255,0.09); }
    .ios-sq-icon { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0; }
    .ios-row-title { flex: 1; font-size: 16.5px; color: #fff; }
    .ios-row-val { font-size: 15px; color: #8e8e93; margin-right: 4px; }
    .ios-chev { width: 16px; height: 16px; stroke: #636366; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    .ios-subpanel { display: none; background: #141a22; padding: 14px; border-top: 0.5px solid rgba(255,255,255,0.08); text-align: left; }

    @media (max-width: 820px) {
      body:not(.force-desktop) .folders-bar { display: none !important; }
      body:not(.force-desktop) .ios-folders-pills { display: flex; }
      body:not(.force-desktop) .ios-top-header { display: flex !important; width: 100%; padding: max(52px, env(safe-area-inset-top)) 14px 6px; justify-content: space-between; align-items: center; position: relative; }
      body:not(.force-desktop) .sidebar { flex: 1 1 100% !important; width: 100% !important; max-width: 100% !important; border-right: none; padding-bottom: 80px; }
      body:not(.force-desktop) .chat-area { display: none !important; flex: 1 1 100% !important; width: 100% !important; max-width: 100% !important; }
      body:not(.force-desktop).mobile-chat-open .sidebar { display: none !important; }
      body:not(.force-desktop).mobile-chat-open .chat-area { display: flex !important; }
      body:not(.force-desktop) .chat-header { position: fixed !important; top: max(54px, env(safe-area-inset-top)) !important; left: 0 !important; right: 0 !important; background: transparent !important; border-bottom: none !important; padding: 0 12px !important; height: 44px !important; z-index: 90 !important; gap: 8px !important; }
      body:not(.force-desktop) .messages { padding-top: calc(max(54px, env(safe-area-inset-top)) + 56px) !important; }
      body:not(.force-desktop) .ios-back-pill, body:not(.force-desktop) .ios-right-avatar-pill { display: flex !important; }
      body:not(.force-desktop) .mobile-back-btn, body:not(.force-desktop) .header-left .header-avatar, body:not(.force-desktop) .header-actions { display: none !important; }
      body:not(.force-desktop) .header-left { flex: 1; height: 44px; padding: 0 16px; border-radius: 22px; background: var(--bg-glass); backdrop-filter: blur(22px); border: 1px solid rgba(255, 255, 255, 0.14); justify-content: center; text-align: center; }
      body:not(.force-desktop) .mobile-bottom-nav { display: flex; position: fixed; left: 16px; right: 16px; bottom: 6px; height: 54px; border-radius: 27px; background: rgba(28, 36, 47, 0.84); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.14); z-index: 40; justify-content: space-around; align-items: center; }
      body:not(.force-desktop).mobile-chat-open .mobile-bottom-nav { display: none !important; }
    }

    body.is-mobile .folders-bar { display: none !important; }
    body.is-mobile .ios-folders-pills { display: flex; }
    body.is-mobile .ios-top-header { display: flex !important; width: 100%; padding: max(52px, env(safe-area-inset-top)) 14px 6px; justify-content: space-between; align-items: center; position: relative; }
    body.is-mobile .sidebar { flex: 1 1 100% !important; width: 100% !important; max-width: 100% !important; border-right: none; padding-bottom: 80px; }
    body.is-mobile .chat-area { display: none !important; flex: 1 1 100% !important; width: 100% !important; max-width: 100% !important; }
    body.is-mobile.mobile-chat-open .sidebar { display: none !important; }
    body.is-mobile.mobile-chat-open .chat-area { display: flex !important; }
    body.is-mobile .chat-header { position: fixed !important; top: max(54px, env(safe-area-inset-top)) !important; left: 0 !important; right: 0 !important; background: transparent !important; border-bottom: none !important; padding: 0 12px !important; height: 44px !important; z-index: 90 !important; gap: 8px !important; }
    body.is-mobile .messages { padding-top: calc(max(54px, env(safe-area-inset-top)) + 56px) !important; }
    body.is-mobile .ios-back-pill, body.is-mobile .ios-right-avatar-pill { display: flex !important; }
    body.is-mobile .mobile-back-btn, body.is-mobile .header-left .header-avatar, body.is-mobile .header-actions { display: none !important; }
    body.is-mobile .header-left { flex: 1; height: 44px; padding: 0 16px; border-radius: 22px; background: var(--bg-glass); backdrop-filter: blur(22px); border: 1px solid rgba(255, 255, 255, 0.14); justify-content: center; text-align: center; }
    body.is-mobile .msg { max-width: 84%; }
    body.is-mobile .mobile-bottom-nav { display: flex; position: fixed; left: 16px; right: 16px; bottom: 6px; height: 54px; border-radius: 27px; background: rgba(28, 36, 47, 0.84); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.14); z-index: 40; justify-content: space-around; align-items: center; }
    body.is-mobile.mobile-chat-open .mobile-bottom-nav { display: none !important; }
    .m-nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; color: #8e8e93; font-size: 11px; font-weight: 500; cursor: pointer; padding: 5px 16px; border-radius: 22px; }
    .m-nav-item.active { background: rgba(255, 255, 255, 0.12); color: #3390ec; }

<body>
    <div class="context-menu" id="msgContextMenu"></div>

  <div class="modal-overlay" id="storyCreateModal" style="display: none;" onclick="if(event.target===this)this.style.display='none'">
    <div class="modal-box">
      <h3 style="margin-bottom: 14px;">Новая история</h3>
      <input type="file" id="storyFileInput" accept="image/*" style="display: none;" onchange="previewStoryImg(event)">
      <button type="button" class="btn-primary" style="background: var(--bg-input); margin-bottom: 10px;" onclick="$('storyFileInput').click()">Выбрать фото</button>
      <img id="storyPreviewImg" style="max-width: 100%; max-height: 220px; border-radius: 14px; display: none; margin: 0 auto 10px;">
      <input type="text" class="auth-input" id="storyCaptionInput" placeholder="Подпись к истории...">
      <button type="button" class="btn-primary" style="margin-bottom: 8px;" onclick="publishStory()">Опубликовать</button>
      <button type="button" class="btn-primary" style="background: var(--bg-input);" onclick="$('storyCreateModal').style.display='none'">Отмена</button>
    </div>
  </div>

  <div class="modal-overlay" id="storyViewModal" style="display: none; background: rgba(0,0,0,0.95);" onclick="this.style.display='none'">
    <div class="modal-box" style="background: transparent; box-shadow: none; border: none; max-width: 400px;">
      <div id="storyViewAuthor" style="font-weight: 700; font-size: 16px; margin-bottom: 10px;">Автор</div>
      <img id="storyViewImg" style="max-width: 100%; max-height: 65dvh; border-radius: 18px; display: none; margin: 0 auto 12px;">
      <div id="storyViewCaption" style="font-size: 16px; background: rgba(255,255,255,0.14); padding: 10px 14px; border-radius: 14px;"></div>
    </div>
  </div>

  <div class="modal-overlay" id="composeModal" style="display: none;" onclick="if(event.target===this)this.style.display='none'">
    <div class="modal-box">
      <h3 style="margin-bottom: 14px;">Новое сообщение</h3>
      <div class="ios-group-card" style="padding: 6px;">
        <button type="button" class="btn-primary" style="background: transparent; text-align: left; padding: 11px 12px;" onclick="createRoomPrompt('group')">Создать группу</button>
        <button type="button" class="btn-primary" style="background: transparent; text-align: left; padding: 11px 12px; border-top: 1px solid rgba(255,255,255,0.06); border-radius: 0;" onclick="createRoomPrompt('channel')">Создать канал</button>
        <button type="button" class="btn-primary" style="background: transparent; text-align: left; padding: 11px 12px; border-top: 1px solid rgba(255,255,255,0.06); border-radius: 0;" onclick="$('composeModal').style.display='none';openCreateFolderModal()">Создать папку</button>
      </div>
      <button type="button" class="btn-primary" onclick="$('composeModal').style.display='none';$('searchInput').focus()">Найти по @username</button>
    </div>
  </div>

  <div class="modal-overlay" id="createFolderModal" style="display: none;" onclick="if(event.target===this)this.style.display='none'">
    <div class="modal-box">
      <h3 style="margin-bottom: 12px;">Новая папка</h3>
      <span class="set-label">Название папки и иконка</span>
      <div style="display: flex; gap: 6px; margin-bottom: 10px;">
        <input type="text" class="auth-input" id="newFolderName" placeholder="Например: Родные" style="margin-bottom: 0; flex: 1;">
        <select class="select-input" id="newFolderIcon" style="width: 76px; margin-bottom: 0;">
          <option value="📁">📁</option><option value="❤️">❤️</option><option value="🔥">🔥</option><option value="🎮">🎮</option><option value="💼">💼</option><option value="⭐">⭐</option>
        </select>
      </div>
      <span class="set-label">Выберите чаты для этой папки</span>
      <div id="folderChatsCheckboxes" style="max-height: 200px; overflow-y: auto; margin-bottom: 12px; text-align: left;"></div>
      <button type="button" class="btn-primary" style="margin-bottom: 8px;" onclick="saveCustomFolder()">Создать папку</button>
      <button type="button" class="btn-primary" style="background: var(--bg-input);" onclick="$('createFolderModal').style.display='none'">Отмена</button>
    </div>
  </div>

  <div class="modal-overlay" id="peerProfileModal" style="display: none;" onclick="if(event.target===this)this.style.display='none'">
    <div class="modal-box">
      <div id="peerModalAvatar" style="width: 86px; height: 86px; border-radius: 50%; background: linear-gradient(135deg, #5ac8fa, #007aff); margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; overflow: hidden;">?</div>
      <h3 id="peerModalName" style="margin-bottom: 4px; font-size: 20px;">Имя</h3>
      <div id="peerModalUser" style="color: #3390ec; font-size: 14.5px; margin-bottom: 4px;">@username</div>
      <div id="peerModalStatus" style="color: #8e8e93; font-size: 13.5px; margin-bottom: 16px;">в сети</div>
      <div style="display: flex; gap: 10px; margin-bottom: 12px;">
        <button type="button" class="btn-primary" onclick="$('peerProfileModal').style.display='none';startCall(false)">Звонок</button>
        <button type="button" class="btn-primary" onclick="$('peerProfileModal').style.display='none';startCall(true)">Видео</button>
      </div>
      <button type="button" class="btn-primary" id="btnToggleArchive" style="background: rgba(255,255,255,0.1); margin-bottom: 8px;" onclick="toggleArchiveChat(chat);$('peerProfileModal').style.display='none';closeMobileChat()">В архив</button>
      <button type="button" class="btn-primary" style="background: var(--bg-input);" onclick="$('peerProfileModal').style.display='none'">Закрыть</button>
    </div>
  </div>

  <div class="modal-overlay" id="qrModal" style="display: none; z-index: 120;" onclick="if(event.target===this)this.style.display='none'">
    <div class="modal-box" style="max-width: 340px;">
      <h3 style="margin-bottom: 6px; font-size: 20px;">Ваш QR-код</h3>
      <p id="qrUserSub" style="color: #8e8e93; font-size: 13.5px; margin-bottom: 16px;">@username</p>
      <div style="background: #fff; padding: 16px; border-radius: 22px; display: inline-block; margin-bottom: 16px;">
        <img id="qrCodeImg" src="" alt="QR" style="width: 210px; height: 210px; display: block;">
      </div>
      <button type="button" class="btn-primary" style="margin-bottom: 8px;" onclick="copyProfileLink()">Скопировать ссылку</button>
      <button type="button" class="btn-primary" style="background: var(--bg-input);" onclick="$('qrModal').style.display='none'">Закрыть</button>
    </div>
  </div>

  <div class="modal-overlay" id="authOverlay" style="background: var(--bg-main);">
    <div class="modal-box" style="max-width: 360px;">
      <img src="/утка.png" style="width: 120px; height: 120px; object-fit: contain; margin: 0 auto 12px; display: block;" alt="TurboGram">
      <h2 id="authTitle" style="margin-bottom: 6px;">Ваш телефон</h2>
      <div class="mode-switch-bar" style="margin-bottom: 12px;">
        <button type="button" class="mode-btn" id="btnModeDesktop" onclick="setDeviceMode('desktop')">Я с ПК</button>
        <button type="button" class="mode-btn" id="btnModeMobile" onclick="setDeviceMode('mobile')">Я с телефона</button>
      </div>
      <p id="authSubtitle" style="color: #8e8e93; font-size: 14px; margin-bottom: 16px;">Проверьте код страны и введите свой номер телефона.</p>
      <div class="auth-error" id="authError"></div>

      <div id="stepPhone">
        <select class="select-input" id="countryCodeSelect">
          <option value="+7">Россия (+7)</option><option value="+7">Казахстан (+7)</option><option value="+375">Беларусь (+375)</option><option value="+380">Украина (+380)</option><option value="+998">Узбекистан (+998)</option><option value="+1">США (+1)</option><option value="+49">Германия (+49)</option><option value="+90">Турция (+90)</option>
        </select>
        <div style="display: flex; gap: 8px; margin-bottom: 14px;">
          <input type="text" class="auth-input" id="countryPrefixDisplay" value="+7" readonly style="width: 72px; text-align: center; font-weight: bold; margin-bottom: 0; color: #3390ec;">
          <input type="tel" class="auth-input" id="authPhone" placeholder="963 512 28 58" autocomplete="off" style="margin-bottom: 0; flex: 1;">
        </div>
        <button type="button" class="btn-primary" onclick="checkAccount()">ПРОДОЛЖИТЬ</button>
      </div>

      <div id="stepLoginPass" style="display: none;">
        <input type="password" class="auth-input" id="loginPasswordInput" placeholder="Введите облачный пароль">
        <button type="button" class="btn-primary" onclick="submitLoginPassword()">ВОЙТИ В АККАУНТ</button>
      </div>

      <div id="stepRegister" style="display: none;">
        <input type="text" class="auth-input" id="authFirstName" placeholder="Имя (обязательно)">
        <input type="text" class="auth-input" id="authLastName" placeholder="Фамилия (необязательно)">
        <input type="text" class="auth-input" id="authUsername" placeholder="Придумайте @username">
        <input type="password" class="auth-input" id="authPassword" placeholder="Облачный пароль (по желанию)">
        <button type="button" class="btn-primary" onclick="completeRegistration()">НАЧАТЬ ОБЩЕНИЕ</button>
      </div>

      <div class="auth-back" id="authBack" onclick="resetAuthStep()">← Изменить номер</div>
    </div>
  </div>
